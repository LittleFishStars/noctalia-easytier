# ══════════════════════════════════════════════════════════════════════════
# ylxc/easytier —— EasyTier 组网状态（状态栏组件 + 详情面板）
#
# 数据全部来自 easytier-cli 的 JSON 输出（-o json），以子进程方式调用，
# 不读写 EasyTier 配置文件、不常驻任何守护进程：
#   bar.luau     栏组件：运行状态 / 节点数 / 直连比 / 最优延迟 / 流量 / 虚拟 IP
#   panel.luau   详情面板：本机信息 + 概览 + 对等节点 + 路由表 + 连接器 + 代理
#   lib/easytier.luau  两者共用的抓取、解析、派生指标与格式化
# 本地校验：noctalia plugins lint ~/.local/share/noctalia/plugins/ylxc-easytier
# ══════════════════════════════════════════════════════════════════════════

author = "ylxc"
id = "ylxc/easytier"
name = "EasyTier"
description = "Shows EasyTier mesh VPN status in the bar, with per-peer latency, loss, traffic, routes and connectors in the panel."
license = "MIT"
version = "1.0.0"
plugin_api = 26
icon = "network"
dependencies = []
tags = ["network", "monitor", "bar", "panel"]

# ── 插件级设置：栏组件与面板共用 ────────────────────────────────────────────

[[setting]]
key = "cli_path"
type = "string"
default = ""
label_key = "settings.cli_path.label"
description_key = "settings.cli_path.description"

[[setting]]
key = "rpc_portal"
type = "string"
default = ""
label_key = "settings.rpc_portal.label"
description_key = "settings.rpc_portal.description"

[[setting]]
key = "instance_name"
type = "string"
default = ""
label_key = "settings.instance_name.label"
description_key = "settings.instance_name.description"

[[setting]]
key = "instance_id"
type = "string"
default = ""
label_key = "settings.instance_id.label"
description_key = "settings.instance_id.description"

[[setting]]
key = "refresh_seconds"
type = "int"
default = 10
min = 2
max = 600
label_key = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"

# ── 阈值：决定栏组件与面板的配色分级 ───────────────────────────────────────

[[setting]]
key = "warn_latency_ms"
type = "int"
default = 150
min = 20
max = 2000
label_key = "settings.warn_latency_ms.label"
description_key = "settings.warn_latency_ms.description"

[[setting]]
key = "crit_latency_ms"
type = "int"
default = 400
min = 50
max = 5000
label_key = "settings.crit_latency_ms.label"
description_key = "settings.crit_latency_ms.description"

[[setting]]
key = "relay_warn"
type = "bool"
default = true
label_key = "settings.relay_warn.label"
description_key = "settings.relay_warn.description"

[[setting]]
key = "loss_warn_percent"
type = "int"
default = 2
min = 1
max = 100
label_key = "settings.loss_warn_percent.label"
description_key = "settings.loss_warn_percent.description"

[[setting]]
key = "loss_crit_percent"
type = "int"
default = 10
min = 1
max = 100
label_key = "settings.loss_crit_percent.label"
description_key = "settings.loss_crit_percent.description"

# ── 面板用的额外查询 ────────────────────────────────────────────────────────

[[setting]]
key = "fetch_extras"
type = "bool"
default = true
label_key = "settings.fetch_extras.label"
description_key = "settings.fetch_extras.description"

[[setting]]
key = "max_peers"
type = "int"
default = 64
min = 4
max = 512
label_key = "settings.max_peers.label"
description_key = "settings.max_peers.description"

[[setting]]
key = "notify_state_change"
type = "bool"
default = false
label_key = "settings.notify_state_change.label"
description_key = "settings.notify_state_change.description"

# ── 栏组件 ──────────────────────────────────────────────────────────────────

[[widget]]
id = "status"
entry = "bar.luau"

  [[widget.setting]]
  key = "display"
  type = "select"
  default = "status"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  options = [
    { value = "status", label_key = "opt_status" },
    { value = "peers", label_key = "opt_peers" },
    { value = "direct", label_key = "opt_direct" },
    { value = "latency", label_key = "opt_latency" },
    { value = "traffic", label_key = "opt_traffic" },
    { value = "ip", label_key = "opt_ip" }
  ]

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  default = "network"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"

  [[widget.setting]]
  key = "show_glyph"
  type = "bool"
  default = true
  label_key = "settings.show_glyph.label"
  description_key = "settings.show_glyph.description"

  [[widget.setting]]
  key = "glyph_color"
  type = "select"
  default = "level"
  label_key = "settings.glyph_color.label"
  description_key = "settings.glyph_color.description"
  options = [
    { value = "level", label_key = "opt_level" },
    { value = "theme", label_key = "opt_theme" },
    { value = "primary", label_key = "opt_primary" },
    { value = "secondary", label_key = "opt_secondary" },
    { value = "tertiary", label_key = "opt_tertiary" },
    { value = "error", label_key = "opt_error" }
  ]

  [[widget.setting]]
  key = "hide_when_stopped"
  type = "bool"
  default = false
  label_key = "settings.hide_when_stopped.label"
  description_key = "settings.hide_when_stopped.description"

  # 手势默认值；用户可在设置里改绑或改成 none
  # 右键故意不在此绑定：按宿主规则，一旦有绑定（哪怕 "none"）就会盖掉
  # bar.luau 里的 onRightClick，右键刷新会失效。要改绑在设置里改。
  [widget.actions]
  left = "panel-toggle ylxc/easytier:panel"
  middle = "settings-open-widget"

# ── 详情面板 ────────────────────────────────────────────────────────────────

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = 620
placement = "floating"
position = "center"
